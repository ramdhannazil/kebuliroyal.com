<!DOCTYPE html>
<html lang="id">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #faf8f5;
      color: #1a1208;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;

    .card {
      background: #fff;
      border: 1px solid #e8e3dc;
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 460px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.06);
    }
    .emoji { font-size: 3.5rem; margin-bottom: 12px; }
    h1 { font-size: 3.5rem; font-weight: 800; color: #ea8a10; line-height: 1; margin-bottom: 8px; }
    h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; color: #1a1208; }
    p { font-size: 0.92rem; color: #78716c; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ea8a10;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 13px 28px;
      border-radius: 50px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
